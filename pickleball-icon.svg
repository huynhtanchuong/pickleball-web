<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pickleball: bright yellow ball with 26 small holes.
       Scaled to 64x64 so it looks crisp in a 16/32px favicon slot. -->
  <defs>
    <radialGradient id="pb" cx="38%" cy="32%" r="68%">
      <stop offset="0%"  stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#pb)" stroke="#713f12" stroke-width="2"/>

  <!-- Hole grid, offset-rows so they read as circular pattern. r sized
       so holes are clearly visible even at 16px. -->
  <g fill="#713f12">
    <circle cx="20" cy="18" r="2.2"/>
    <circle cx="32" cy="14" r="2.2"/>
    <circle cx="44" cy="18" r="2.2"/>

    <circle cx="14" cy="28" r="2.2"/>
    <circle cx="26" cy="26" r="2.2"/>
    <circle cx="38" cy="26" r="2.2"/>
    <circle cx="50" cy="28" r="2.2"/>

    <circle cx="18" cy="38" r="2.2"/>
    <circle cx="30" cy="36" r="2.2"/>
    <circle cx="42" cy="38" r="2.2"/>

    <circle cx="24" cy="48" r="2.2"/>
    <circle cx="36" cy="48" r="2.2"/>
  </g>

  <!-- Soft highlight for a plastic sheen -->
  <ellipse cx="22" cy="18" rx="8" ry="4" fill="rgba(255,255,255,0.25)"/>
</svg>
